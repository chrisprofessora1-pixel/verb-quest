<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verb Quest</title>
<style>
  :root{
    --bg:#0d1020; --card:#181c33; --card2:#20263f; --line:#2c3352;
    --txt:#eef1ff; --dim:#9aa3c7;
    --cyan:#5ee7ff; --gold:#ffd166; --pink:#ff6b9d; --purple:#8b6cff;
    --good:#3ddc97; --bad:#ff5d73;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{min-height:100vh;display:flex;justify-content:center;
    background:radial-gradient(1200px 600px at 50% -10%,#1d2a55 0%,#0d1020 60%)}
  #app{width:100%;max-width:620px;padding:14px 14px 22px;display:flex;flex-direction:column;gap:10px;min-height:100vh}
  .hud{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.02em;
    position:sticky;top:0;z-index:30;background:#0d1020;padding:8px 0;margin:-8px 0 2px;
    box-shadow:0 10px 14px -12px #000}
  .hud .spacer{flex:1}
  .pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 11px;color:var(--dim)}
  .pill b{color:var(--gold)}
  .iconbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;width:34px;height:34px;
    display:grid;place-items:center;font-size:15px;cursor:pointer;color:var(--txt);padding:0}
  .navbtn{font-family:inherit;border:0;border-radius:999px;padding:9px 13px;font-size:12.5px;font-weight:800;
    color:#fff;background:linear-gradient(180deg,#6b57ff,#5a45e6);box-shadow:0 3px 0 #3f2fb0;
    cursor:pointer;white-space:nowrap;letter-spacing:.01em}
  .navbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #3f2fb0}
  .bar{height:7px;border-radius:999px;background:var(--card);border:1px solid var(--line);overflow:hidden}
  .bar>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--cyan),var(--purple));
    transition:width .35s ease}
  .screen{flex:1;display:flex;flex-direction:column;gap:12px;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:26px;line-height:1.05;margin:2px 0 0;letter-spacing:-.02em}
  h1 span{color:var(--cyan)}
  h2{font-size:19px;margin:0;letter-spacing:-.01em}
  p{margin:0;color:var(--dim);line-height:1.45;font-size:14.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
  .btn{appearance:none;border:0;border-radius:14px;padding:13px 18px;font-size:16px;font-weight:800;
    font-family:inherit;cursor:pointer;background:linear-gradient(180deg,#6b57ff,#5a45e6);color:#fff;
    box-shadow:0 6px 0 #3f2fb0;transition:transform .06s ease, box-shadow .06s ease;width:100%}
  .btn:active{transform:translateY(3px);box-shadow:0 3px 0 #3f2fb0}
  .btn.ghost{background:var(--card2);color:var(--txt);box-shadow:0 6px 0 #12172b;border:1px solid var(--line)}
  .btn.gold{background:linear-gradient(180deg,#ffcf5c,#f5b52d);color:#2b2000;box-shadow:0 6px 0 #b8820d}
  .levels{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .lvl{display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:var(--card);
    border:1px solid var(--line);border-radius:13px;padding:10px 11px;cursor:pointer;text-align:left;
    color:var(--txt);font-family:inherit;font-size:14.5px;font-weight:750;line-height:1.2;
    transition:border-color .15s,transform .06s}
  .lvl:active{transform:scale(.99)}
  .lvl .n{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;
    background:#252c4a;color:var(--cyan);flex:none}
  .lvl .t{display:flex;flex-direction:column;gap:2px}
  .lvl .t small{font-weight:600;color:var(--dim);font-size:11px}
  .lvl .st{font-size:10.5px;color:var(--gold);letter-spacing:1px}
  .lvl.done{border-color:#2f6b52;background:#152a24}
  .lvl.next{border-color:var(--cyan)}
  .lvl .n.go{background:var(--cyan);color:#06202a}
  .qmeta{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--dim);font-weight:700}
  .prompt{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 16px;
    font-size:21px;line-height:1.45;font-weight:650;min-height:104px;display:flex;align-items:center;
    justify-content:center;text-align:center}
  .prompt .gap{color:var(--cyan);border-bottom:3px dashed #46507a;padding:0 18px;margin:0 4px}
  .prompt.big{font-size:58px;min-height:150px}
  .opts{display:grid;gap:9px}
  .opt{appearance:none;font-family:inherit;font-size:17px;font-weight:750;color:var(--txt);
    background:var(--card2);border:1.5px solid var(--line);border-radius:14px;padding:16px;
    cursor:pointer;transition:transform .06s,border-color .15s,background .15s}
  .opt:active{transform:scale(.99)}
  .opt.right{background:#15392c;border-color:var(--good);color:#c9ffe6}
  .opt.wrong{background:#3a1720;border-color:var(--bad);color:#ffd6dd}
  .opt.dim{opacity:.45}
  .fb{border-radius:14px;padding:12px 14px;font-size:14px;font-weight:650;line-height:1.4;border:1px solid transparent}
  .fb.ok{background:#14332a;border-color:#2d6b55;color:#b9ffe0}
  .fb.no{background:#33161f;border-color:#7a2b3a;color:#ffc9d4}
  .fb b{color:#fff}
  .row{display:flex;gap:9px}
  .row .btn{flex:1}
  .slots{min-height:62px;border:2px dashed #39415f;border-radius:14px;padding:8px;display:flex;
    flex-wrap:wrap;gap:7px;align-items:flex-start;background:#12162a}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
  .chip{appearance:none;font-family:inherit;font-size:15.5px;font-weight:700;color:var(--txt);
    background:#262d4c;border:1px solid #3a4368;border-radius:10px;padding:10px 13px;cursor:pointer}
  .chip:active{transform:scale(.97)}
  .chip.used{opacity:.28;pointer-events:none}
  .chip.in{background:#20344f;border-color:#3d5f8a}
  .finish{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:8px 0}
  .stars{font-size:34px;letter-spacing:4px;color:var(--gold)}
  .score{font-size:44px;font-weight:900;letter-spacing:-.03em}
  .score small{font-size:16px;color:var(--dim);font-weight:700}
  .tiny{font-size:12px;color:var(--dim);text-align:center}
  .timer{height:6px;border-radius:999px;background:#20263f;overflow:hidden;border:1px solid var(--line)}
  .timer>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--good),var(--gold),var(--bad))}
  .streak{font-size:12px;color:var(--gold);font-weight:800}
  .ver{font-size:10px;color:#5b6488;font-weight:800;letter-spacing:.06em}
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="pill">⭐ <b id="hudScore">0</b></div>
    <span class="ver">v3</span>
    <div class="spacer"></div>
    <button class="iconbtn" id="muteBtn" aria-label="Sound on or off">🔊</button>
    <button class="navbtn" id="homeBtn" aria-label="Play another game">🎮 Play another game</button>
  </div>
  <div class="bar"><i id="progress"></i></div>
  <div id="screen" class="screen"></div>
</div>

<script>
(function(){
  "use strict";

  // ---------- sound ----------
  var muted = false, actx = null;
  function tone(freq, dur, type, vol){
    if (muted) return;
    try{
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "sine"; o.frequency.value = freq;
      g.gain.value = vol || 0.05;
      o.connect(g); g.connect(actx.destination);
      var t = actx.currentTime;
      g.gain.setValueAtTime(vol || 0.05, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.1));
      o.start(t); o.stop(t + (dur || 0.1));
    }catch(e){}
  }
  function sndGood(){ tone(660,.08,"sine",.06); setTimeout(function(){ tone(990,.12,"sine",.055); }, 80); }
  function sndBad(){ tone(180,.16,"sawtooth",.045); }
  function sndTap(){ tone(420,.05,"triangle",.035); }
  function sndWin(){ [523,659,784,1046].forEach(function(f,i){ setTimeout(function(){ tone(f,.14,"sine",.055); }, i*110); }); }

  // ---------- data ----------
  var L1 = [
    {s:"____ me! I have a new haircut.", a:"Look at", o:["Look at","Look for"],
     why:"You can see the person, so you look AT it."},
    {s:"I'm ____ my Pokemon cards. I can't find them.", a:"looking for", o:["looking at","looking for"],
     why:"You can't find them, so you look FOR them."},
    {s:"____ the picture on page 30.", a:"Look at", o:["Look at","Look for"],
     why:"The picture is in front of you. Look AT it."},
    {s:"She is ____ her phone in the bag.", a:"looking for", o:["looking at","looking for"],
     why:"The phone is lost, so she looks FOR it."},
    {s:"____ the camera and smile!", a:"Look at", o:["Look at","Look for"],
     why:"The camera is here. Look AT the camera."},
    {s:"We are ____ a birthday present for my mom.", a:"looking for", o:["looking at","looking for"],
     why:"The present is not here yet. Look FOR it."},
    {s:"____ the board, please.", a:"Look at", o:["Look at","Look for"],
     why:"The board is in the classroom. Look AT it."},
    {s:"He is ____ his keys under the sofa.", a:"looking for", o:["looking at","looking for"],
     why:"The keys are missing. Look FOR them."}
  ];

  var L2 = [
    {s:"____ the homework", a:"do", o:["do","make"], why:"Homework is a task you complete. Do the homework."},
    {s:"____ a cake", a:"make", o:["do","make"], why:"You create the cake. Make a cake."},
    {s:"____ the dishes", a:"do", o:["do","make"], why:"The dishes are a job, not a new thing. Do the dishes."},
    {s:"____ coffee", a:"make", o:["do","make"], why:"You produce it. Make coffee."},
    {s:"____ the housework", a:"do", o:["do","make"], why:"Housework is a set of tasks. Do the housework."},
    {s:"____ a plan", a:"make", o:["do","make"], why:"You create it. Make a plan."},
    {s:"____ a mistake", a:"make", o:["do","make"], why:"In English it is always make a mistake."},
    {s:"____ the laundry", a:"do", o:["do","make"], why:"Laundry is a chore. Do the laundry."}
  ];

  var L3 = [
    {e:"📷", a:"Look at the camera!", w:["Make a cake.","Do the dishes."]},
    {e:"🔎📱", a:"I'm looking for my phone.", w:["Look at the phone.","Make a phone call."]},
    {e:"🍰", a:"Make a cake.", w:["Do a cake.","Look at a cake."]},
    {e:"🍽️", a:"Do the dishes.", w:["Make the dishes.","Look for the dishes."]},
    {e:"📝", a:"Do the homework.", w:["Make the homework.","Look at the homework."]},
    {e:"☕", a:"Make coffee.", w:["Do coffee.","Look for coffee."]},
    {e:"🧹", a:"Do the housework.", w:["Make the housework.","Look at the housework."]},
    {e:"📋", a:"Make a plan.", w:["Do a plan.","Look for a plan."]},
    {e:"👀🖼️", a:"Look at the picture.", w:["Look for the picture.","Make a picture."]},
    {e:"🃏", a:"I'm looking for my Pokemon cards.", w:["I'm looking at my Pokemon cards.","I'm making Pokemon cards."]},
    {e:"😬", a:"Make a mistake.", w:["Do a mistake.","Look at a mistake."]},
    {e:"🧺", a:"Do the laundry.", w:["Make the laundry.","Look for the laundry."]}
  ];

  var L4 = [
    {a:["Look","at","the","camera"], ok:"Look at the camera."},
    {a:["I","am","looking","for","my","phone"], ok:"I am looking for my phone."},
    {a:["She","makes","a","cake"], ok:"She makes a cake."},
    {a:["He","does","the","dishes"], ok:"He does the dishes."},
    {a:["Let","us","make","a","plan"], ok:"Let us make a plan."},
    {a:["I","do","my","homework","after","school"], ok:"I do my homework after school."}
  ];

  var TOTAL = 320;
  var state = { done:{1:false,2:false,3:false,4:false}, levelScore:{1:0,2:0,3:0,4:0} };
  var runScore = 0;
  function total(){
    return state.levelScore[1] + state.levelScore[2] + state.levelScore[3] + state.levelScore[4];
  }
  function paintHud(){ document.getElementById("hudScore").textContent = total() + runScore; }

  // ---------- helpers ----------
  function el(html){ var d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }
  function shuffle(arr){ var a = arr.slice(); for (var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function addScore(n){ runScore += n; paintHud(); }
  function setNav(show){
    var b = document.getElementById("homeBtn");
    if (b) b.style.display = show ? "" : "none";
  }
  function setProgress(pct){ document.getElementById("progress").style.width = Math.max(0, Math.min(100,pct)) + "%"; }
  var screenEl = document.getElementById("screen");

  // ---------- home ----------
  function home(){
    setNav(false);
    var doneCount = Object.keys(state.done).filter(function(k){ return state.done[k]; }).length;
    setProgress(doneCount/4*100);
    var levels = [
      {n:1, t:"Look at / Look for", s:"See it or find it"},
      {n:2, t:"Do / Make", s:"Chores or creations"},
      {n:3, t:"Catch the Word", s:"60 second round"},
      {n:4, t:"Sentence Builder", s:"Put words in order"}
    ];
    var nextLevel = 0;
    for (var k=1;k<=4;k++){ if (!state.done[k]){ nextLevel = k; break; } }

    var html = '<div class="screen">' +
      '<h1>Verb <span>Quest</span></h1>' +
      '<p>Tap a level. Look at, look for, do and make.</p>' +
      '<div class="levels">' +
      levels.map(function(l){
        var d = state.done[l.n];
        var isNext = !d && l.n === nextLevel;
        return '<button class="lvl '+(d?"done ":"")+(isNext?"next":"")+'" data-lvl="'+l.n+'">' +
          '<span class="n '+(isNext?"go":"")+'">'+(d?"✓":(isNext?"▶":l.n))+'</span>' +
          '<span class="t">'+l.t+'<small>'+l.s+'</small></span>' +
          '<span class="st">'+(d?"⭐⭐⭐":"☆☆☆")+'</span>' +
        '</button>';
      }).join("") +
      '</div>' +
      '</div>';
    screenEl.innerHTML = html;

    screenEl.querySelectorAll(".lvl").forEach(function(b){
      b.addEventListener("click", function(){ sndTap(); startLevel(parseInt(b.dataset.lvl,10)); });
    });
  }

  function startLevel(n){
    runScore = 0;
    setNav(true);
    if (n === 1) levelChoice(1, L1, "Look at or Look for?");
    else if (n === 2) levelChoice(2, L2, "Do or Make?");
    else if (n === 3) levelTimer();
    else levelBuild();
  }

  // ---------- generic choice levels ----------
  function levelChoice(levelNum, data, title){
    var i = 0, right = 0, locked = false;
    var order = shuffle(data.map(function(_,k){ return k; }));
    setProgress(0);

    function render(){
      if (i >= order.length){ finishLevel(levelNum, right, data.length); return; }
      locked = false;
      var item = data[order[i]];
      var opts = shuffle(item.o);
      screenEl.innerHTML = '<div class="screen">' +
        '<div class="qmeta"><span>'+title+'</span><span>'+(i+1)+' / '+order.length+'</span></div>' +
        '<div class="prompt">'+esc(item.s).replace(/____/g,'<span class="gap"></span>')+'</div>' +
        '<div class="opts">' +
          opts.map(function(o){ return '<button class="opt" data-v="'+esc(o)+'">'+esc(o)+'</button>'; }).join("") +
        '</div>' +
        '<div id="fbWrap"></div>' +
      '</div>';

      screenEl.querySelectorAll(".opt").forEach(function(b){
        b.addEventListener("click", function(){
          if (locked) return;
          locked = true;
          var ok = b.dataset.v === item.a;
          if (ok){ b.classList.add("right"); right++; addScore(10); sndGood(); }
          else {
            b.classList.add("wrong"); sndBad();
            screenEl.querySelectorAll(".opt").forEach(function(x){
              if (x.dataset.v === item.a) x.classList.add("right");
              else if (x !== b) x.classList.add("dim");
            });
          }
          document.getElementById("fbWrap").innerHTML =
            '<div class="fb '+(ok?"ok":"no")+'">'+(ok?"✅ ":"💡 ")+'<b>'+esc(item.a)+'</b>. '+esc(item.why)+'</div>';
          setTimeout(function(){ i++; setProgress(i/order.length*100); render(); }, ok ? 700 : 1500);
        });
      });
    }
    render();
  }

  // ---------- timed level ----------
  function levelTimer(){
    var rounds = shuffle(L3).slice(0,10);
    var i = 0, right = 0, locked = false, left = 60, tick = null, finished = false;
    setProgress(0);

    screenEl.innerHTML = '<div class="screen">' +
      '<div class="qmeta"><span>Catch the Word</span><span id="clock">60s</span></div>' +
      '<div class="timer"><i id="tbar"></i></div>' +
      '<div class="prompt big" id="emoji">📷</div>' +
      '<div class="opts" id="opts"></div>' +
      '<div id="fbWrap"></div>' +
    '</div>';

    function draw(){
      var item = rounds[i];
      document.getElementById("emoji").textContent = item.e;
      var opts = shuffle([item.a].concat(item.w));
      var box = document.getElementById("opts");
      box.innerHTML = opts.map(function(o){ return '<button class="opt" data-v="'+esc(o)+'">'+esc(o)+'</button>'; }).join("");
      box.querySelectorAll(".opt").forEach(function(b){
        b.addEventListener("click", function(){
          if (locked) return;
          locked = true;
          var ok = b.dataset.v === item.a;
          if (ok){ b.classList.add("right"); right++; addScore(10); sndGood(); }
          else {
            b.classList.add("wrong"); sndBad();
            box.querySelectorAll(".opt").forEach(function(x){
              if (x.dataset.v === item.a) x.classList.add("right");
              else if (x !== b) x.classList.add("dim");
            });
          }
          document.getElementById("fbWrap").innerHTML =
            '<div class="fb '+(ok?"ok":"no")+'">'+(ok?"✅ ":"💡 ")+'<b>'+esc(item.a)+'</b></div>';
          setTimeout(function(){
            i++;
            setProgress(i/rounds.length*100);
            if (i >= rounds.length || left <= 0){ stop(); finishOnce(); return; }
            locked = false;
            document.getElementById("fbWrap").innerHTML = "";
            draw();
          }, ok ? 450 : 900);
        });
      });
    }

    function stop(){ if (tick){ clearInterval(tick); tick = null; } }
    function finishOnce(){ if (finished) return; finished = true; stop(); finishLevel(3, right, rounds.length); }

    tick = setInterval(function(){
      left--;
      var c = document.getElementById("clock"); if (c) c.textContent = left + "s";
      var tb = document.getElementById("tbar"); if (tb) tb.style.width = (left/60*100) + "%";
      if (left <= 0){ finishOnce(); }
    }, 1000);

    draw();
  }

  // ---------- sentence builder ----------
  function levelBuild(){
    var i = 0, right = 0;
    setProgress(0);

    function render(){
      if (i >= L4.length){ finishLevel(4, right, L4.length); return; }
      var item = L4[i];
      var pool = shuffle(item.a).map(function(w,k){ return {w:w, id:k}; });
      var picked = [];

      screenEl.innerHTML = '<div class="screen">' +
        '<div class="qmeta"><span>Sentence Builder</span><span>'+(i+1)+' / '+L4.length+'</span></div>' +
        '<div class="slots" id="slots"></div>' +
        '<div class="chips" id="pool"></div>' +
        '<div id="fbWrap"></div>' +
        '<button class="btn gold" id="check">Check sentence</button>' +
      '</div>';

      function draw(){
        document.getElementById("slots").innerHTML = picked.map(function(p){
          return '<button class="chip in" data-out="'+p.id+'">'+esc(p.w)+'</button>';
        }).join("");
        document.getElementById("pool").innerHTML = pool.map(function(p){
          var used = picked.some(function(x){ return x.id === p.id; });
          return '<button class="chip '+(used?"used":"")+'" data-in="'+p.id+'">'+esc(p.w)+'</button>';
        }).join("");

        document.querySelectorAll("[data-in]").forEach(function(b){
          b.addEventListener("click", function(){
            var id = parseInt(b.dataset.in,10);
            var found = pool.filter(function(p){ return p.id === id; })[0];
            if (found && !picked.some(function(x){ return x.id === id; })){ picked.push(found); sndTap(); draw(); }
          });
        });
        document.querySelectorAll("[data-out]").forEach(function(b){
          b.addEventListener("click", function(){
            var id = parseInt(b.dataset.out,10);
            picked = picked.filter(function(x){ return x.id !== id; });
            sndTap(); draw();
          });
        });
      }

      document.getElementById("check").addEventListener("click", function(){
        if (picked.length !== item.a.length){
          document.getElementById("fbWrap").innerHTML = '<div class="fb no">Use all the words.</div>';
          return;
        }
        var made = picked.map(function(p){ return p.w; }).join(" ");
        var ok = made === item.ok.replace(/[.]$/,"");
        if (ok){ right++; addScore(10); sndGood(); }
        else sndBad();
        document.getElementById("fbWrap").innerHTML =
          '<div class="fb '+(ok?"ok":"no")+'">'+(ok?"✅ Perfect. ":"💡 ")+'<b>'+esc(item.ok)+'</b></div>' +
          (ok ? "" : '<p class="tiny">Tap the words above to change them.</p>');
        if (ok){
          setTimeout(function(){ i++; setProgress(i/L4.length*100); render(); }, 1150);
        }
      });

      draw();
    }
    render();
  }

  // ---------- finish ----------
  function finishLevel(levelNum, right, qTotal){
    state.done[levelNum] = true;
    var earned = right * 10;
    if (earned > state.levelScore[levelNum]) state.levelScore[levelNum] = earned;
    runScore = 0;
    paintHud();
    var stars = right === qTotal ? "⭐⭐⭐" : (right >= qTotal*0.7 ? "⭐⭐☆" : "⭐☆☆");
    var msg = right === qTotal ? "Perfect level!" : (right >= qTotal*0.7 ? "Nice work!" : "Good try. Play it again.");
    sndWin();
    setProgress(100);

    var nextLabel = levelNum < 4 ? ("Next: level " + (levelNum+1)) : "See my score";
    screenEl.innerHTML = '<div class="screen"><div class="card finish">' +
      '<div class="stars">'+stars+'</div>' +
      '<h2>'+msg+'</h2>' +
      '<p>'+right+' of '+qTotal+' correct</p>' +
      '<div class="score">'+total()+'<small> / '+TOTAL+'</small></div>' +
      '<button class="btn gold" id="more">🎮 Play another game</button>' +
      '<div class="row" style="width:100%">' +
        '<button class="btn ghost" id="again">Play again</button>' +
        '<button class="btn" id="next">'+nextLabel+'</button>' +
      '</div>' +
    '</div></div>';

    document.getElementById("again").addEventListener("click", function(){ sndTap(); startLevel(levelNum); });
    document.getElementById("next").addEventListener("click", function(){
      sndTap();
      if (levelNum < 4) startLevel(levelNum + 1); else finale();
    });
    document.getElementById("more").addEventListener("click", function(){ sndTap(); home(); });
  }

  function finale(){
    setNav(true);
    setProgress(100);
    var doneCount = Object.keys(state.done).filter(function(k){ return state.done[k]; }).length;
    var t = total();
    var line = t >= 300 ? "You know these verbs." :
               t >= 200 ? "Almost there. Play the hard level again." :
               "Good start. Play again tomorrow.";
    screenEl.innerHTML = '<div class="screen"><div class="card finish">' +
      '<div class="stars">🏆</div>' +
      '<h2>Quest complete</h2>' +
      '<p>'+line+'</p>' +
      '<div class="score">'+total()+'<small> / '+TOTAL+'</small></div>' +
      '<p class="tiny">'+doneCount+' of 4 levels finished</p>' +
      '<button class="btn gold" id="more">🎮 Play another game</button>' +
    '</div></div>';
    document.getElementById("more").addEventListener("click", function(){ sndTap(); home(); });
  }

  // ---------- chrome ----------
  document.getElementById("muteBtn").addEventListener("click", function(){
    muted = !muted;
    this.textContent = muted ? "🔇" : "🔊";
  });
  document.getElementById("homeBtn").addEventListener("click", function(){ home(); });

  home();
})();
</script>
</body>
</html>
